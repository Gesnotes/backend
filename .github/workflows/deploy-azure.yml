name: Deploy backend to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: gesnotesacr.azurecr.io
  IMAGE_NAME: gesnotes-api
  RESOURCE_GROUP: DefaultResourceGroup-PAR
  CONTAINER_APP: gesnotes-api-wp
  TARGET_PORT: 4000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container App
        run: |
          APP="${{ env.CONTAINER_APP }}"
          RG="${{ env.RESOURCE_GROUP }}"
          az extension add --name containerapp --upgrade -y
          az containerapp registry set -n "$APP" -g "$RG" --server "${{ env.REGISTRY }}" --identity system
          az containerapp update -n "$APP" -g "$RG" --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          az containerapp ingress update -n "$APP" -g "$RG" --target-port ${{ env.TARGET_PORT }}
