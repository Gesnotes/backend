name: Setup Azure standard environment (one-off)

on:
  workflow_dispatch:

env:
  REGISTRY: gesnotesacr.azurecr.io
  ACR_NAME: gesnotesacr
  RESOURCE_GROUP: DefaultResourceGroup-PAR
  LOCATION: germanywestcentral
  NEW_ENV: gesnotes-env-std
  CONTAINER_APP: gesnotes-api-std

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create standard environment, app and AcrPull role
        run: |
          set -e
          az extension add --name containerapp --upgrade -y
          az provider register --namespace Microsoft.App --wait || true
          az containerapp env create -n "$NEW_ENV" -g "$RESOURCE_GROUP" -l "$LOCATION"
          az containerapp create -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --environment "$NEW_ENV" \
            --image mcr.microsoft.com/k8se/quickstart:latest \
            --ingress external --target-port 4000 \
            --cpu 0.25 --memory 0.5Gi --min-replicas 1 --max-replicas 2 \
            --system-assigned
          PRINCIPAL=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query identity.principalId -o tsv)
          ACR_ID=$(az acr show -n "$ACR_NAME" --query id -o tsv)
          az role assignment create --assignee-object-id "$PRINCIPAL" --assignee-principal-type ServicePrincipal --role AcrPull --scope "$ACR_ID"
          sleep 60
          az containerapp registry set -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --server "$REGISTRY" --identity system
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --image "$REGISTRY/gesnotes-api:latest"
          az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv
