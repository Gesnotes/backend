name: Setup Azure standard environment (one-off)

on:
  workflow_dispatch:

env:
  REGISTRY: gesnotesacr.azurecr.io
  RESOURCE_GROUP: DefaultResourceGroup-PAR
  LOCATION: germanywestcentral
  NEW_ENV: gesnotes-env-b
  CONTAINER_APP: gesnotes-api-b

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create workload-profiles environment and app
        run: |
          set -e
          az extension add --name containerapp --upgrade -y
          az containerapp env create --help | grep -i -B1 -A3 -E "environment-mode|workload-profiles" || true
          az containerapp env create -n "$NEW_ENV" -g "$RESOURCE_GROUP" -l "$LOCATION" --environment-mode WorkloadProfiles
          az containerapp env show -n "$NEW_ENV" -g "$RESOURCE_GROUP" --query "{mode:properties.environmentMode, profiles:properties.workloadProfiles}" -o json
          az containerapp create -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --environment "$NEW_ENV" \
            --image mcr.microsoft.com/k8se/quickstart:latest \
            --ingress external --target-port 4000 \
            --workload-profile-name Consumption \
            --cpu 0.25 --memory 0.5Gi --min-replicas 1 --max-replicas 2 \
            --system-assigned
          az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query "{fqdn:properties.configuration.ingress.fqdn, principal:identity.principalId}" -o json
