name: CI

# Bloque la CI sur toute PR — jusqu'ici seul deploy.yml existait, déclenché
# uniquement sur push vers main, sans aucune vérification avant le déploiement.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Le client est généré dans src/generated/ (gitignored) : sans cette
      # étape, typecheck/build/test échouent tous sur un import introuvable.
      - run: npm run prisma:generate

      - run: npm run typecheck

      - run: npm test
